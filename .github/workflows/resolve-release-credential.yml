name: Resolve release credential

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/resolve-release-credential.yml"

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve configured cross-repo credential
        env:
          TDESK_RELEASE_TOKEN: ${{ secrets.TDESK_RELEASE_TOKEN }}
          TDESK_FINAL_TOKEN: ${{ secrets.TDESK_FINAL_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAT: ${{ secrets.PAT }}
          TDESK2_TOKEN: ${{ secrets.TDESK2_TOKEN }}
        shell: bash
        run: |
          found=""
          for name in TDESK_RELEASE_TOKEN TDESK_FINAL_TOKEN RELEASE_TOKEN GH_PAT PAT TDESK2_TOKEN; do
            if [ -n "${!name}" ]; then
              found="$name"
              break
            fi
          done
          if [ -n "$found" ]; then
            echo "CONFIGURED_RELEASE_CREDENTIAL=$found"
          else
            echo "CONFIGURED_RELEASE_CREDENTIAL=NONE"
          fi
