name: Build 0.1.17 legacy restart bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-legacy-restart-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download published Velopack setup
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build\input | Out-Null
          gh release download v0.1.17 --repo ikozlica/TDesk-Final --pattern "Traktat.TDesk2-win-Setup.exe" --dir build\input
          $setup = Join-Path $env:GITHUB_WORKSPACE "build\input\Traktat.TDesk2-win-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Published Velopack setup was not downloaded."
          }
          Write-Host "SETUP_OK size=$((Get-Item $setup).Length)"

      - name: Resolve Inno Setup compiler
        id: inno
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler is unavailable."
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build restart-fixed legacy bridge
        shell: powershell
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "build\input\Traktat.TDesk2-win-Setup.exe"
          $iss = Join-Path $env:GITHUB_WORKSPACE "legacy\TDesk2LegacyBridgeRestartFix.iss"
          & "${{ steps.inno.outputs.path }}" "/DAppVersion=0.1.17" "/DVelopackSetup=$setup" $iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed."
          }
          $bridge = Join-Path $env:GITHUB_WORKSPACE "build\bridge\TDesk2-0.1.17-LegacyBridge-RestartFix.exe"
          if (-not (Test-Path $bridge)) {
            throw "Restart-fixed bridge was not created."
          }
          Write-Host "BRIDGE_OK size=$((Get-Item $bridge).Length)"

      - name: Upload repair asset and switch legacy manifest
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bridge = Join-Path $env:GITHUB_WORKSPACE "build\bridge\TDesk2-0.1.17-LegacyBridge-RestartFix.exe"
          gh release upload v0.1.17 $bridge --repo ikozlica/TDesk-Final

          $sha = (Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/ikozlica/TDesk-Final/releases/download/v0.1.17/TDesk2-0.1.17-LegacyBridge-RestartFix.exe"
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "update-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = "0.1.17"
          $manifest.installer_url = $url
          $manifest.sha256 = $sha
          $manifest.full_installer_url = $url
          $manifest.full_sha256 = $sha
          $manifest.notes = @("Jednokratni prijelaz na Velopack s automatskim ponovnim pokretanjem TDesk2.")
          $manifest | ConvertTo-Json -Depth 6 | Set-Content $manifestPath -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          git commit -m "Use restart-fixed TDesk2 0.1.17 legacy bridge"
          git push
